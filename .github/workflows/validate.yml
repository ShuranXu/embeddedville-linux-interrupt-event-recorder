name: Validate learner release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m mkdocs build --strict
      - run: python tools/check_uapi.py
      - run: python tools/check_visual_manifest.py
      - run: python tools/check_site.py
      - name: Verify public-only release boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e reference
          test ! -e maintainer
          ! grep -RIl --include='*.c' --include='*.h' 'struct irqrec_reader' starter fixture userspace

